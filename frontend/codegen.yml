overwrite: true
schema: "http://localhost:3000/graphql"
documents: "./graphql/**/*.ts"
generates:
  ./graphql/generated/index.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      withComponent: false
      withHOC: false
      skipTypename: false
      reactApolloVersion: 3
      apolloClientVersion: 3
