input CreateUserInput {
  email: String!
  name: String!
  phone: String
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Mutation {
  createUser(createUserInput: CreateUserInput!): User!
  removeUser(id: ID!): Boolean!
  updateUser(updateUserInput: UpdateUserInput!): User!
}

type Query {
  user(id: ID!): User!
  users: [User!]!
}

input UpdateUserInput {
  email: String
  id: ID!
  name: String
  phone: String
}

type User {
  cpf: String!
  createdAt: DateTime!
  email: String!
  id: ID!
  isActive: Boolean!
  isAdmin: Boolean!
  name: String!
  phone: String
  updatedAt: DateTime!
}